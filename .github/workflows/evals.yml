name: Evals

# Manual only. Paired cases need a human AWS Builder ID sign-in, which CI
# can't do, and this job needs KALTURA_ADMIN_SECRET, so it must never run on
# pull_request or pull_request_target (a fork PR could read the secret).
on:
  workflow_dispatch:
    inputs:
      grep:
        description: Only run cases whose name contains this substring
        required: false
        type: string

permissions:
  contents: read

jobs:
  evals:
    runs-on: ubuntu-latest
    environment: evals
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.x'
      - run: npm ci
      - name: Install the claude CLI (LLM judge)
        run: npm install -g @anthropic-ai/claude-code@2.1.283
      - name: Write server/agent.json
        run: printf '%s' "$AGENT_JSON" > server/agent.json
        env:
          AGENT_JSON: ${{ secrets.AGENT_JSON }}
      - name: Start the server
        run: |
          node server/index.mjs > server.log 2>&1 &
          disown
        env:
          PORT: '8080'
          KALTURA_PARTNER_ID: ${{ secrets.KALTURA_PARTNER_ID }}
          TOKEN_ENC_KEY: ${{ secrets.TOKEN_ENC_KEY }}
      - name: Wait for the server
        run: |
          for _ in $(seq 1 30); do
            curl -sf http://localhost:8080/api/config -o /dev/null && exit 0
            sleep 1
          done
          echo "server did not come up within 30s" >&2
          cat server.log >&2
          exit 1
      - name: Run evals
        run: |
          if [ -n "$GREP" ]; then
            node server/evals/runner.mjs --grep "$GREP"
          else
            node server/evals/runner.mjs
          fi
        env:
          EVAL_NONINTERACTIVE: '1'
          GREP: ${{ inputs.grep }}
          PORT: '8080'
          KALTURA_PARTNER_ID: ${{ secrets.KALTURA_PARTNER_ID }}
          KALTURA_ADMIN_SECRET: ${{ secrets.KALTURA_ADMIN_SECRET }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
