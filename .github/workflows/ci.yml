name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # The maintainer uses macOS and attendees use Windows, so test all three.
        os: [ubuntu-latest, macos-latest, windows-latest]
        # 20.6 is package.json's engines floor. 24.x is current Node.
        node-version: ['20.6', '24.x']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm ci
      - run: npm test
      - name: Check JS syntax
        shell: bash
        run: git ls-files '*.js' '*.cjs' '*.mjs' | xargs -n1 node --check
      - name: Smoke test the launcher
        shell: bash
        env:
          NEVADA_WIDGET_ID: ci-dummy-widget-id
        run: |
          export NEVADA_HOME="$RUNNER_TEMP/nevada-home"
          log="$RUNNER_TEMP/nevada.log"
          node server/index.mjs --no-open > "$log" 2>&1 &
          pid=$!
          # Git Bash's kill may not reach the Windows node.exe, so taskkill it too.
          trap 'kill "$pid" 2>/dev/null || true; [ "$RUNNER_OS" = Windows ] && taskkill //F //IM node.exe &>/dev/null || true' EXIT
          url=""
          for _ in $(seq 1 30); do
            url=$(grep -o 'http://127.0.0.1:[0-9]*/' "$log" | head -1 || true)
            [ -n "$url" ] && break
            sleep 1
          done
          [ -n "$url" ] || { cat "$log"; exit 1; }
          health=$(curl -fsS "${url}api/health") || { cat "$log"; exit 1; }
          echo "$health"
          echo "$health" | grep -q nevada-reinvent
